name: test-and-deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check app/ scripts/ tests/ monitoring/ --output-format=github
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
  deepchecks:
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
      HF_DATASET_ID: baptle/financial_headlines_market_based
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: dvc repro
      - run: python scripts/run_deepchecks.py
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, deepchecks]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="${ECR_REGISTRY:-${{ steps.login-ecr.outputs.registry }}}"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Save image URI
        run: echo "$IMAGE_URI" > image-uri.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-image-uri
          path: image-uri.txt
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: deploy-image-uri}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Download current task definition
        run: aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query taskDefinition > task-definition.json
      - id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/finbert-api:${{ github.sha }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
